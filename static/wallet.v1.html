<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScopePay Wallet</title><link rel="stylesheet" href="/static/style.css?v=5"></head><body>
<header><b>ScopePay</b><nav><a href="/">Home</a><a href="/demo">Demo</a><a class="on" href="/wallet">Wallet</a><a href="/store?m=greenleaf" target="_blank">Greenleaf Grocer ↗</a><a href="/store?m=northside" target="_blank">Northside Electronics ↗</a></nav></header>
<main>
  <div class="grid2">
    <section class="card">
      <h2>Your PayPal</h2>
      <div id="wallet" class="muted">Loading…</div>
      <div id="linkmsg"></div>
      <h2 style="margin-top:24px">Shops</h2><div id="merchants" class="muted"></div>
      <h2 style="margin-top:24px">PYUSD escrow</h2><div id="escrow" class="muted"></div>
    </section>
    <section class="card">
      <h2>Generate a ScopePay code</h2>
      <label>What is it for?</label><input id="label" placeholder="e.g. Weekly groceries (AI agent)">
      <div class="row">
        <div><label>Spending cap (£)</label><input id="cap" type="number" value="20" min="1" step="0.01"></div>
        <div><label>Expires in</label><select id="minutes"><option value="15">15 min</option><option value="60" selected>1 hour</option><option value="1440">1 day</option><option value="10080">7 days</option></select></div>
      </div>
      <div class="row">
        <div><label>Only usable at</label><select id="lock"><option value="">Any merchant</option></select></div>
        <div><label>Issued to</label><select id="issued"><option value="user">Me</option><option value="ai_agent">AI agent</option></select></div>
      </div>
      <label><input id="multi" type="checkbox" style="width:auto"> Allow several payments until the cap is used</label>
      <p><button id="gen">Generate code</button></p>
      <div id="newcode"></div>
    </section>
  </div>
  <section class="card"><h2>Your codes</h2><table><thead><tr><th>Code</th><th>For</th><th>Locked to</th><th>Cap</th><th>Left</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody id="codes"></tbody></table></section>
  <section class="card" id="activity"><div class="row" style="align-items:center"><h2 style="margin:0">Activity &amp; evidence trail</h2><span id="chain" style="text-align:right"></span></div>
    <table><thead><tr><th>Time</th><th>Merchant</th><th>Code</th><th>Amount</th><th>Result</th><th>Detail</th><th>Evidence</th></tr></thead><tbody id="tx"></tbody></table></section>
</main>
<script>
const $=id=>document.getElementById(id), gbp=n=>'£'+Number(n).toFixed(2), t=s=>new Date(s*1000).toLocaleTimeString();
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
let lockFilled=false;
async function load(){
  const s=await api('/api/state');
  if(!lockFilled){$('lock').innerHTML+=Object.entries(s.merchants).map(([k,m])=>`<option value="${k}">${m.emoji} ${m.name}</option>`).join('');lockFilled=true}
  $('merchants').innerHTML=Object.entries(s.merchants).map(([k,m])=>`<div>${m.emoji} <b>${m.name}</b> → ${m.payee_email?`<small>paid into ${m.payee_email}</small>`:'<small style="color:var(--bad)">no payee set (pays your own account)</small>'}</div>`).join('');
  const e=s.escrow;$('escrow').innerHTML=e.mode=='sepolia'?`<div>⛓️ <b>Ethereum Sepolia</b> · <a href="${e.explorer}" target="_blank">contract</a></div><small>payer ${e.payer||''} · ${e.payer_balance!==undefined?e.payer_balance.toFixed(2)+' PYUSD':''} ${e.error?'· '+e.error:''}</small>`:`<div>🧪 <b>Simulated</b> (mirrors PayCodeEscrow.sol)</div><small>refund window ${e.window_seconds}s · set SEPOLIA_RPC_URL + ESCROW_ADDRESS + PAYER_KEY to go on-chain</small>`;
  if(s.wallet.vault_id){$('wallet').innerHTML=`<p>✅ <b>${s.wallet.email}</b><br><small>vault id ${s.wallet.vault_id}</small></p><button class="ghost" onclick="unlink()">Unlink</button>`;$('gen').disabled=false}
  else{$('wallet').innerHTML=`<p>No PayPal linked yet. Link it once; codes then pay from it without any PayPal popup.</p><button onclick="link()">Link PayPal (sandbox)</button>`;$('gen').disabled=true}
  $('codes').innerHTML=s.codes.map(c=>`<tr><td>SP-…${c.hint}${c.issued_to=='ai_agent'?' 🤖':''}</td><td>${c.label}</td><td>${c.merchant_name||'Any'}</td><td>${gbp(c.cap)}</td><td>${gbp(c.remaining)}</td><td>${c.status=='active'?c.minutes_left+' min':'—'}</td><td><span class="pill ${c.status}">${c.status}</span></td><td>${c.status=='active'?`<button class="ghost" onclick="revoke('${c.hint}')">Revoke</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="muted" style="font-family:var(--body)">No codes yet. Generate one above.</td></tr>';
  $('tx').innerHTML=s.transactions.map(x=>`<tr><td>${t(x.time)}</td><td>${x.merchant}</td><td>…${x.code_hint}</td><td>${x.rail=='pyusd'?Number(x.amount).toFixed(2)+' PYUSD':gbp(x.amount)}</td><td><span class="pill ${x.result}">${x.result}</span></td><td><small>${x.detail}</small></td><td>${x.evidence_id?`<a href="/evidence/${x.evidence_id}" target="_blank">${x.evidence_id}</a>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="muted" style="font-family:var(--body)">No payments yet. Use a code in one of the shops.</td></tr>';
  $('chain').innerHTML=s.chain.valid?`<span class="pill active">🔒 trail intact · ${s.chain.records} records</span>`:`<span class="pill DECLINED">⚠ trail tampered at ${s.chain.broken_at}</span>`;
}
async function link(){try{const {approve_url}=await api('/api/link',{});(window.top!==window?window.top:window).location.href=approve_url}catch(e){$('linkmsg').innerHTML=`<div class="notice bad">${e.message}</div>`}}
async function unlink(){await api('/api/unlink',{});load()}
async function revoke(h){await api(`/api/codes/${h}/revoke`,{});load()}
$('gen').onclick=async()=>{try{const {code}=await api('/api/codes',{cap:+$('cap').value,minutes:+$('minutes').value,label:$('label').value,multi_use:$('multi').checked,merchant_lock:$('lock').value||null,issued_to:$('issued').value});
  const lk=$('lock').selectedOptions[0].text, mins=$('minutes').selectedOptions[0].text;
  $('newcode').innerHTML=`<div class="code">${code}<div class="vterms">Cap ${gbp(+$('cap').value)} · ${$('lock').value?'Only at '+lk.replace(/^\S+\s/,''):'Any shop'} · Expires in ${mins} · ${$('issued').value=='ai_agent'?'For your AI agent':'For you'}${$('multi').checked?' · Multi-use':''}</div></div><div class="row" style="margin-top:18px;align-items:center"><button style="flex:0 0 auto" onclick="navigator.clipboard.writeText('${code}');this.textContent='Copied ✓'">Copy code</button><small>Shown once. Paste it at checkout in a shop.</small></div>`;load()}
  catch(e){$('newcode').innerHTML=`<div class="notice bad">${e.message}</div>`}};
const q=new URLSearchParams(location.search).get('linked');if(q=='ok')$('linkmsg').innerHTML='<div class="notice ok">PayPal linked.</div>';if(q=='cancelled')$('linkmsg').innerHTML='<div class="notice bad">Linking cancelled.</div>';
load();setInterval(load,4000);
</script></body></html>
