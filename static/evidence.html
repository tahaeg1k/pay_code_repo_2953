<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence record</title><link rel="stylesheet" href="/static/style.css?v=5">
<style>dl{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;word-break:break-all}.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}@media print{header button{display:none}}</style></head><body>
<header><b>ScopePay · Evidence record</b><nav><button class="ghost" onclick="dl()">Download JSON</button> <button class="ghost" onclick="print()">Print / PDF</button></nav></header>
<main id="m"><div class="card muted">Loading…</div></main>
<script>
const id=location.pathname.split('/').pop(), gbp=n=>'£'+Number(n).toFixed(2); let data;
const row=(k,v)=>v===undefined||v===null||v===''?'':`<dt>${k}</dt><dd>${v}</dd>`;
fetch('/api/evidence/'+id).then(r=>r.json()).then(d=>{data=d;if(d.error){document.getElementById('m').innerHTML=`<div class="card">${d.error}</div>`;return}
 const r=d.record, iss=d.code_issuance, rq=r.request||{}, s=r.settlement;
 document.getElementById('m').innerHTML=`
 <section class="card"><div class="row" style="align-items:center"><h2 style="margin:0">${r.id} · ${r.type.replace('_',' ')}</h2><span style="text-align:right"><span class="pill ${r.decision||'active'}">${r.decision||'recorded'}</span> ${d.chain.valid?'<span class="pill active">🔒 chain verified'+(d.chain.signatures_checked&&r.sig?' · signed':'')+'</span>':'<span class="pill DECLINED">⚠ '+(d.chain.problem==='signature'?'signature invalid':'chain broken')+'</span>'}</span></div>
 <dl style="margin-top:12px">${row('Recorded at (UTC)',r.recorded_at)}${row('Reason',r.reason)}${row('Merchant',rq.merchant_name)}${row('Amount',rq.amount!==undefined?gbp(rq.amount)+' '+rq.currency:'')}${row('Channel',rq.channel)}${row('Code',r.code?(r.domain==='relief'?'RC-…'+r.code.hint+' · relief code':'SP-…'+r.code.hint+' · '+r.code.label):'')}${row('Relief pot',r.pot)}${row('Claim',r.claim)}${row('Household',r.household?r.household+' people · '+(r.place||''):'')}${row('Relief code',r.relief_code&&r.relief_code.cap?gbp(r.relief_code.cap)+' for '+r.relief_code.categories.join(', ')+' · issued by '+r.relief_code.issued_by:'')}${row('Amount',r.type==='donation_received'||r.type==='relief_returned'?gbp(r.amount):'')}${row('From',r.from?r.from.city+', '+r.from.country:'')}${row('Paid for by',r.funded_by&&r.funded_by.length?r.funded_by.map(f=>f.donation+' '+gbp(f.amount)).join(', '):'')}${row('Client',rq.client?`${rq.client.ip||''} · <small>${rq.client.user_agent||''}</small>`:'')}</dl></section>
 ${rq.basket&&rq.basket.length?`<section class="card"><h2>Basket</h2><table><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Line</th></tr>${rq.basket.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${gbp(i.price)}</td><td>${gbp(i.price*i.qty)}</td></tr>`).join('')}</table></section>`:''}
 ${r.checks?`<section class="card"><h2>Authorisation checks</h2><table><tr><th>Check</th><th>Result</th><th>Detail</th></tr>${r.checks.map(c=>`<tr><td>${c.check}</td><td>${c.passed?'✅':'❌'}</td><td>${c.detail}</td></tr>`).join('')}</table></section>`:''}
 ${r.domain==='relief'?'':`<div class="grid2">`}${r.domain==='relief'?'':''}
 <section class="card" ${r.domain==='relief'?'style="display:none"':''}><h2>Rules the payer set</h2><dl>${iss?row('Issued at',iss.recorded_at)+row('Issued to',iss.issued_to)+row('Cap',gbp(iss.rules.cap))+row('Expires',iss.rules.expires_at)+row('Merchant lock',iss.rules.merchant_lock||'any')+row('Multi-use',iss.rules.multi_use?'yes':'no')+row('Issuance record',iss.id):'<dd>—</dd>'}${r.rules_at_time?row('Spent before this',gbp(r.rules_at_time.spent_before)):''}</dl></section>
 ${r.domain==='relief'?`<section class="card"><h2>Settlement</h2><dl>${s?row('Rail','Relief pot · '+(s.mode==='paypal'?'PayPal Payouts':'simulated'))+row('Paid to',s.paid_to)+row('Payout batch',s.payout_batch_id?s.payout_batch_id+' · '+s.payout_status:''):r.decision?'<dd>No money moved.</dd>':'<dd>—</dd>'}</dl></section>`:''}<section class="card" ${r.domain==='relief'?'style="display:none"':''}><h2>${s&&s.rail=='pyusd_escrow'?'PYUSD escrow settlement':'PayPal settlement'}</h2><dl>${s?(s.rail=='pyusd_escrow'?row('Mode',s.mode)+row('Escrow payment #',s.escrow_payment_id)+row('Merchant wallet',s.paid_to)+row('Evidence hash (on-chain)','<span class="mono">'+s.evidence_hash+'</span>')+row('Pay tx',s.tx_link?`<a href="${s.tx_link}" target="_blank">${s.tx}</a>`:s.tx):row('Settlement',s.settlement_model==='platform_then_payout'?'Captured to ScopePay, then paid out to merchant':s.settlement_model==='direct'?'Paid directly to merchant':'ScopePay account')+row('Paid to',s.paid_to)+row('Payout batch',s.payout_batch_id?s.payout_batch_id+' · '+s.payout_status:'')+row('Payout error',s.payout_error?'<span style="color:var(--bad)">'+s.payout_error+'</span>':'')+row('Payee merchant id',s.payee_merchant_id)+row('Order id',s.paypal_order_id)+row('PayPal authorization (held, then captured)',s.paypal_authorization_id)+row('Capture id',s.paypal_capture_id)+row('Capture status',s.capture_status)+row('Capture time',s.capture_time)+row('Payer vault id',s.payer_vault_id)):'<dd>No money moved.</dd>'}</dl></section></div>
 ${d.escrow_status?escrowPanel(d):''}
 <section class="card"><h2>Integrity</h2><dl class="mono">${row('Sequence',r.seq)}${row('Previous hash',r.prev_hash)}${row('Record hash',r.hash)}${row('Chain head',d.chain.head||'')}${row('Signed by',r.sig?'ScopePay · '+r.sig_alg+' key '+r.key_id:'not signed')}${row('Signature',r.sig||'')}</dl>
 <p><small>Each record's SHA-256 covers its contents and the previous record's hash, so editing or deleting any past record breaks the chain. ScopePay signs each hash with its Ed25519 key, so a rebuilt chain cannot pass: check any record against the <a href="/api/evidence/public-key">public key</a> with <code>python verify_evidence.py</code>.</small></p></section>`});
const ROLE={dispute:['Payer','Dispute payment','warn'],merchant_refund:['Merchant','Refund buyer',''],release:['Anyone','Release to merchant',''],resolve_refund:['Arbiter','Refund payer','bad'],resolve_release:['Arbiter','Pay merchant','']};
function escrowPanel(d){const e=d.escrow_status;if(e.error)return `<section class="card"><h2>Escrow</h2><div class="notice bad">${e.error}</div></section>`;
 const hist=(d.escrow_actions||[]).map(a=>`<tr><td>${a.recorded_at}</td><td>${a.label}</td><td><span class="pill ${a.status_after}">${a.status_after}</span></td><td>${a.tx_link?`<a href="${a.tx_link}" target="_blank">tx</a>`:`<small>${a.tx}</small>`}</td><td><a href="/evidence/${a.id}">${a.id}</a></td></tr>`).join('');
 return `<section class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Escrow · dispute &amp; refund</h2><span style="text-align:right"><span class="pill ${e.status}">${e.status}</span></span></div>
 <p>${e.status=='Escrowed'?(e.seconds_to_release>0?`Refund window open: <b id="cd">${e.seconds_to_release}</b>s left. The payer can dispute; after that anyone can release funds to the merchant.`:'Refund window closed. Funds can be released to the merchant.'):e.status=='Disputed'?'Frozen by the payer. The arbiter decides using this evidence record, or the merchant can refund.':`Final: ${e.status.toLowerCase()}.`}</p>
 <div class="actions">${e.allowed_actions.map(a=>`<button class="${ROLE[a][2]}" onclick="act('${a}',this)">${ROLE[a][0]}: ${ROLE[a][1]}</button>`).join('')}</div><div id="actmsg"></div>
 ${hist?`<table style="margin-top:12px"><tr><th>When (UTC)</th><th>Action</th><th>Status</th><th>Tx</th><th>Record</th></tr>${hist}</table>`:''}</section>`}
async function act(a,b){b.disabled=true;b.textContent='Sending…';const r=await fetch(`/api/escrow/${id}/${a}`,{method:'POST'});const j=await r.json();
 if(!r.ok){document.getElementById('actmsg').innerHTML=`<div class="notice bad">${j.error}</div>`;b.disabled=false;return}location.reload()}
setInterval(()=>{const c=document.getElementById('cd');if(c){const v=+c.textContent-1;if(v<=0)location.reload();else c.textContent=v}},1000);
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=id+'.json';a.click()}
</script></body></html>
